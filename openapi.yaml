  /api/v1/registrations/{id}/payments:
    get:
      tags:
        - Payments
      summary: List payments for registration
      description: Retrieves all payment attempts for a given registration. Restricted to team members of the registered team, coordinators, or administrators.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Registration ID
      responses:
        '200':
          description: Payment attempts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentRecord'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized to view registration payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Payments
      summary: Initiate payment for registration
      description: |
        Initiates a payment attempt for a PENDING_PAYMENT registration using the configured PaymentGatewayAdapter (Factory Pattern).
        Server computes payable amount from trusted event fee. If simulated outcome is SUCCESS, registration transitions to CONFIRMED.
        Only the team leader of the registering team (or coordinator/admin) can initiate payment.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Registration ID
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
          description: CSRF double-submit token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '201':
          description: Payment attempt recorded and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment successful. Registration confirmed.
                  data:
                    $ref: '#/components/schemas/PaymentDetailResponse'
        '400':
          description: Registration not eligible (e.g. CANCELLED) or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only team leader can pay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registration already has a successful payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

