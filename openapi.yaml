              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Passes
      summary: Send or retry confirmation and pass delivery email
      description: Requests or retries email dispatch for an eligible confirmed registration with verified pass. Enforces duplicate-send cooldown.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Registration ID
        - in: header
