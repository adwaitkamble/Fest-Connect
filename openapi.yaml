                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: festconnect_token
      description: HttpOnly signed JWT session cookie
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional Bearer token header for API clients and automated tests

  schemas:
    RegisterRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          example: Adwait
          maxLength: 100
        last_name:
          type: string
          example: Sharma
          maxLength: 100
        email:
          type: string
          format: email
          example: adwait@festconnect.edu
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: securePass123!
        phone:
          type: string
          nullable: true
          example: '+91 9876543210'
        college_name:
          type: string
          nullable: true
          example: Vellore Institute of Technology
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: '2004-05-15'
        skills:
          type: array
          items:
            type: string
          example: ['TypeScript', 'Express', 'MySQL']

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: adwait@festconnect.edu
        password:
          type: string
          format: password
          example: demo1234

    AuthenticatedUser:
      type: object
      properties:
        participant_id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Adwait
        last_name:
          type: string
          example: Sharma
        email:
          type: string
          format: email
          example: adwait@festconnect.edu
        phone:
          type: string
          nullable: true
          example: '+91 9876543210'
        college_name:
          type: string
          nullable: true
          example: Vellore Institute of Technology
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: '2004-05-15'
        role:
          type: string
          enum: [PARTICIPANT, COORDINATOR, ADMIN]
          example: PARTICIPANT
        skills:
          type: array
          items:
            type: string
          example: ['TypeScript', 'Express', 'MySQL']
        coordinator_id:
          type: integer
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Invalid email address format

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - AUTHENTICATION_FAILED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - UNPROCESSABLE_ENTITY
                - INTERNAL_SERVER_ERROR
              example: VALIDATION_ERROR
            message:
              type: string
              example: Request validation failed
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        liveness:
          type: string
          example: ok
        readiness:
          type: string
          example: unconfigured
        uptime:
          type: number
          example: 12.34
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: festconnect-api
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          example: development
        subsystems:
          type: object
          properties:
            api:
              type: string
              example: healthy
            database:
              type: string
              example: not_configured_in_phase_01
            cache:
              type: string
              example: not_configured_in_phase_01

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: festconnect-api
        dependencies:
          type: object
          properties:
            database:
              type: object
              properties:
                connected:
                  type: boolean
                  example: true

    ScheduleItem:
      type: object
      required:
        - schedule_id
        - event_id
        - event_date
        - start_time
        - end_time
        - venue
      properties:
        schedule_id:
          type: integer
          example: 1
        event_id:
          type: integer
          example: 1
        event_date:
          type: string
          format: date
          example: '2026-11-15'
        start_time:
          type: string
          example: '09:00:00'
        end_time:
          type: string
          example: '18:00:00'
        venue:
          type: string
          example: 'Auditorium Hall B'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventItem:
      type: object
      required:
        - event_id
        - event_name
        - event_type
        - min_team_size
        - max_team_size
        - registration_fee
        - status
      properties:
        event_id:
          type: integer
          example: 1
        coordinator_id:
          type: integer
          nullable: true
          example: 1
        coordinator_name:
          type: string
          nullable: true
          example: 'Prof. Shalu Mahajan'
        coordinator_email:
          type: string
          nullable: true
          example: 'coordinator@festconnect.edu'
        event_name:
          type: string
          example: 'CodeCraft 24h Hackathon'
        event_type:
          type: string
          example: 'Coding / Software'
        description:
          type: string
          nullable: true
          example: 'Flagship university 24-hour hackathon.'
        min_team_size:
          type: integer
          example: 2
        max_team_size:
          type: integer
