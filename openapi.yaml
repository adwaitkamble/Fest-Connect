openapi: 3.0.3
info:
  title: FestConnect API
  description: |
    Centralized Technical Fest & Event Registration System API.
    Developed for Object Oriented Modelling and System Design (BCER27PC02).
  version: 0.1.0
servers:
  - url: http://localhost:4000
    description: Local Development Server

tags:
  - name: Health
    description: System liveness and dependency readiness probes
  - name: Authentication
    description: User registration, session management, and credential verification
  - name: Events
    description: Public technical fest event discovery and coordinator/admin event management
  - name: Schedules
    description: Event schedule entries, dates, venues, and timings
  - name: Teams
    description: Team creation, roster management, and membership controls
  - name: Registrations
    description: Event team registrations, validation, and lifecycle management
  - name: Payments
    description: Payment processing, mock gateway adapter simulation, and payment attempt tracking
  - name: Passes
    description: Digital entry passes, cryptographic QR code verification, and receipt retrieval

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Liveness health check
      description: Returns liveness status and basic runtime diagnostic metadata.
      responses:
        '200':
          description: Service is alive and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/ready:
    get:
      tags:
        - Health
      summary: Dependency readiness check
      description: Verifies connectivity to authoritative MySQL persistence layer.
      responses:
        '200':
          description: Database connected and ready to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database unreachable or initializing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /api/v1/auth/csrf:
    get:
      tags:
        - Authentication
      summary: Obtain or initialize CSRF token
      description: |
        Generates or refreshes a cryptographically random CSRF token, sets the
        readable `festconnect_csrf` cookie, and returns the token in the response payload.
      responses:
        '200':
          description: CSRF token initialized
          headers:
            Set-Cookie:
              description: Double-Submit CSRF cookie (festconnect_csrf)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    example: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Public participant registration
      description: |
        Registers a new participant account. Self-registration is strictly restricted
        to the PARTICIPANT role; client attempts to inject COORDINATOR or ADMIN roles
        are rejected. Sets an HttpOnly session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Participant registered successfully
          headers:
            Set-Cookie:
              description: HttpOnly JWT authentication cookie (festconnect_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Participant account registered successfully.
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Participant with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticates a participant, coordinator, or admin using email and password.
        Sets an HttpOnly JWT session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly JWT authentication cookie (festconnect_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful.
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Clears the HttpOnly authentication session cookie.
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Cleared cookie with expiration in the past
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user profile
      description: Returns the sanitized profile and verified role of the current session.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: Unauthenticated or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events:
    get:
      tags:
        - Events
      summary: Discover fest events
      description: Returns a paginated list of technical fest events with category, status, and search filters.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Items per page
        - in: query
          name: event_type
          schema:
            type: string
          description: Filter by event category
        - in: query
          name: status
          schema:
            type: string
            enum: [UPCOMING, ACTIVE, COMPLETED, CANCELLED]
          description: Filter by event lifecycle status
        - in: query
          name: search
          schema:
            type: string
          description: Search keywords in event name or description
      responses:
        '200':
          description: Paginated events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Events
      summary: Create new fest event
      description: Creates a new event. Authorized for ADMIN and COORDINATOR roles. Coordinators may only create events assigned to themselves.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
          description: Required when authenticating via CookieAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventItem'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions or coordinator boundary violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}:
    get:
      tags:
        - Events
      summary: Get event details
      description: Returns complete event details including coordinator info and associated schedules.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Unique event identifier
      responses:
        '200':
          description: Event details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
        '400':
          description: Invalid event ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Events
      summary: Update fest event
      description: Partially updates event fields. Authorized for ADMIN or the assigned COORDINATOR.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Unique event identifier
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
          description: Required when authenticating via CookieAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventItem'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized coordinator or reassignment attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/schedules:
    get:
      tags:
        - Schedules
      summary: List event schedules
      description: Returns all schedule entries and venue timings for the specified event.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Unique event identifier
      responses:
        '200':
          description: Schedule list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleItem'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Schedules
      summary: Add schedule entry to event
      description: Adds a new schedule entry to an event. Authorized for ADMIN or assigned COORDINATOR.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Unique event identifier
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
          description: Required when authenticating via CookieAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Schedule entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ScheduleItem'
        '400':
          description: Validation error or contradictory timings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized coordinator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/schedules/{scheduleId}:
    patch:
      tags:
        - Schedules
      summary: Update event schedule entry
      description: Updates timing or venue of a schedule entry. Authorized for ADMIN or assigned COORDINATOR.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Unique event identifier
        - in: path
          name: scheduleId
          required: true
          schema:
            type: integer
          description: Unique schedule identifier
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
          description: Required when authenticating via CookieAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Schedule entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ScheduleItem'
        '400':
          description: Validation error or contradictory timings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized coordinator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event or schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams:
    get:
      tags:
        - Teams
      summary: List user teams
      description: Returns all teams in which the authenticated user is either the leader or a member.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: List of teams retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamSummary'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Teams
      summary: Create a new team
      description: Creates a new team with the authenticated participant as the team leader.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
          description: CSRF double-submit token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TeamDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Team name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{id}:
    get:
      tags:
        - Teams
      summary: Get team details
      description: Returns full team information including roster members and registrations. Access is restricted to team members, event coordinators, or administrators.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Team ID
      responses:
        '200':
          description: Team details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TeamDetail'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not a member of the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Teams
      summary: Disband team
      description: Disbands the team and removes memberships. Restricted to team leader or administrators. Cannot disband if active registrations exist.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Team ID
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
          description: CSRF double-submit token
      responses:
        '200':
          description: Team disbanded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Team disbanded successfully
        '400':
          description: Team cannot be disbanded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only team leader can disband
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{id}/members:
    get:
      tags:
        - Teams
      summary: List team members
      description: Returns roster members of the specified team.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Team ID
      responses:
        '200':
          description: Team members retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Teams
      summary: Add member to team
      description: Adds a participant to the team by participant ID or email address. Only the team leader can add members.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Team ID
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
          description: CSRF double-submit token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TeamMember'
        '400':
          description: Invalid request or team status prevents modifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only team leader can add members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team or participant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Participant already a member of the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/teams/{id}/members/{participantId}:
    delete:
      tags:
        - Teams
      summary: Remove member or leave team
      description: Removes a member from the team. Can be invoked by the team leader (to remove a member) or by a member (to leave). The team leader cannot be removed.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Team ID
        - in: path
          name: participantId
          required: true
          schema:
            type: integer
          description: Participant ID to remove
        - in: header
          name: x-csrf-token
          required: true
          schema:
            type: string
          description: CSRF double-submit token
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Member removed from team successfully
        '400':
          description: Cannot remove leader or team status prevents modifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/registrations:
    get:
      tags:
        - Registrations
      summary: List registrations
      description: Retrieves registrations for teams the authenticated user belongs to, or all registrations for coordinators/admins.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: query
          name: team_id
          schema:
            type: integer
          description: Filter by team ID
        - in: query
          name: event_id
          schema:
            type: integer
          description: Filter by event ID
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED]
          description: Filter by registration status
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Registrations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationDetail'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Registrations
      summary: Register team for event
      description: Registers an eligible team for a technical fest event. Enforces event status (ACTIVE/UPCOMING), team size bounds (min/max), duplicate registration prevention, and schedule conflict detection across all team members. Initial status is PENDING_PAYMENT.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - in: header
          name: x-csrf-token
          required: true
